# Cloudflare Pages (direct upload, không nối GitHub): python tools/len-cloudflare.py
name = "power-up-3"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[ai]
binding = "AI"   # Workers AI cho bot Will: whisper-large-v3-turbo (nghe) + deepgram/aura-1 (đọc)

[[d1_databases]]
