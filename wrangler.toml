database_name = "learning-english"
database_id = "c436a287-57c0-47a6-b0dd-7dfa2e1376cf"


[[services]]
binding = "CLAUDE"   # Worker claude-sin (thư mục Ban web iPad\claude-sin): gọi Claude từ Singapore — Cloudflare Hồng Kông bị Anthropic chặn (403)
service = "claude-sin"
