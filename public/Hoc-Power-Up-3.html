<!doctype html>
<html lang="vi">
<head>
<link rel="icon" href="icon-192.png"><script src="cau-hinh.js"></script><script src="tai-ve.js"></script><script src="may-chu.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="darkreader-lock">
<title>Học Power Up 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --nen: #e6eef0; --the: #ffffff; --chu: #26323a; --mo: #56626b; --vien: #d3dfe2;
    --xanh: #0d7887; --xanh-nhat: #d9f1f4; --cam: #f28a1c; --cam-nhat: #fff0de;
    --dau: 56px; --cuoi: 76px; --ben: 232px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--nen); color: var(--chu); font: 500 15px/1.4 Nunito, "Segoe UI", system-ui, sans-serif;
         display: grid; grid-template: var(--dau) 1fr var(--cuoi) / var(--ben) 1fr; overflow: hidden; touch-action: manipulation; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--cam); outline-offset: 2px; }

  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px;
           background: var(--the); border-bottom: 1px solid var(--vien); }
  header h1 { font-size: 18px; font-weight: 800; margin: 0; white-space: nowrap; }
  header h1 span { color: var(--xanh); }
  .goi-y { color: var(--mo); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .goi-y b { color: var(--xanh); }
  .phai { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .nut-nho { border: 1px solid var(--vien); background: var(--the); border-radius: 10px; padding: 6px 12px; font-weight: 700; }
  a.nut-nho { text-decoration: none; color: inherit; }
  .nut-nho:hover { border-color: var(--xanh); color: var(--xanh); }
  .nut-nho[aria-pressed="true"] { background: var(--xanh); border-color: var(--xanh); color: #fff; }

  aside { background: var(--the); border-right: 1px solid var(--vien); overflow-y: auto; padding: 12px 10px 20px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--mo); margin: 14px 8px 6px; }
  .muc { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none;
         padding: 8px 10px; border-radius: 10px; font-weight: 700; }
  .muc small { color: var(--mo); font-weight: 500; }
  .muc i { display: block; font-style: normal; font-weight: 500; color: var(--mo); font-size: 12.5px; line-height: 1.25; }
  .muc.dang i { color: #fff; }
  .muc:hover { background: var(--xanh-nhat); }
  .muc.dang { background: var(--xanh); color: #fff; }
  .muc.dang small { color: #ffffff; }
  .muc.review { font-weight: 500; padding-left: 20px; }
  .video { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 8px; }
  .video button { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--cam); background: var(--cam-nhat);
                  font-size: 18px; font-weight: 800; color: #8f4700; }
  .video button:hover { background: var(--cam); color: #fff; }
  .video p { margin: 0; color: var(--mo); font-size: 13px; }

  /* ngón tay trong khung sách do app lo (chụm = phóng to trang, kéo = di chuyển) → menu, thanh bút, thanh nghe luôn nằm trên màn hình */
  main { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 0; padding: 12px;
         user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  .trang { position: relative; background: #fff; box-shadow: 0 6px 24px rgba(0, 0, 0, .14); }
  .trang.phong { overflow: hidden; box-shadow: none; background: var(--nen); }
  .lop { position: absolute; inset: 0; }
  .trang.phong .lop { inset: auto; left: 0; top: 0; }
  .trang img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
  canvas.viet { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  body.dang-viet canvas.viet { pointer-events: auto; touch-action: none; cursor: crosshair; }
  body.dang-viet main { touch-action: none; }
  body.dang-viet.chon-cho canvas.viet { cursor: zoom-in; }
  body.dang-viet .nghe { opacity: .55; pointer-events: none; }

  /* Thanh bút khi bật chế độ Viết */
  #cong-cu { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 3; display: none; align-items: center; gap: 6px;
             background: var(--the); border: 1px solid var(--vien); border-radius: 16px; padding: 6px 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, .12); }
  body.dang-viet #cong-cu { display: flex; }
  body.dang-viet main { padding-top: 66px; }          /* chừa chỗ cho thanh bút, không che trang */
  #cong-cu .vach { width: 1px; align-self: stretch; background: var(--vien); margin: 2px 2px; }
  #cong-cu button { min-width: 40px; height: 40px; border-radius: 12px; border: 1px solid transparent; background: none; font-weight: 700; padding: 0 8px; white-space: nowrap; }
  #cong-cu button:hover { border-color: var(--vien); }
  #cong-cu button[aria-pressed="true"] { background: var(--xanh-nhat); border-color: var(--xanh); color: var(--xanh); }
  #cong-cu .mau { width: 32px; min-width: 32px; height: 32px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--vien); padding: 0; }
  #cong-cu .mau[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--xanh); background: var(--m); }
  #cong-cu .bao { font-size: 12px; color: var(--mo); padding: 0 4px; max-width: 150px; }
  .trang .so { position: absolute; bottom: -22px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--mo); }
  .lat { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 96px; border: 0; border-radius: 14px;
         background: rgba(255, 255, 255, .85); font-size: 28px; font-weight: 800; color: var(--xanh); box-shadow: 0 2px 10px rgba(0,0,0,.12); z-index: 2; }
  .lat:hover { background: var(--xanh); color: #fff; }
  .lat:disabled { opacity: .25; pointer-events: none; }
  #truoc { left: 8px; } #sau { right: 8px; }

  /* Nút nghe đặt đè lên huy hiệu "disc" in trong sách */
  .nghe { position: absolute; z-index: 2; width: 3.7%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
          border: 3px solid rgba(21, 151, 168, .45); background: rgba(21, 151, 168, .06); padding: 0;
          transition: transform .15s, border-color .15s, background .15s; }
  .nghe::before { content: ''; position: absolute; inset: -4px; border-radius: 50%; }
  .nghe:hover { border-color: var(--xanh); background: rgba(21, 151, 168, .16); transform: translate(-50%, -50%) scale(1.15); }
  .nghe.dang { border-color: var(--cam); background: rgba(242, 138, 28, .18); animation: nhip 1.1s ease-in-out infinite; }
  @keyframes nhip { 50% { transform: translate(-50%, -50%) scale(1.2); border-width: 4px; } }
  @media (prefers-reduced-motion: reduce) { .nghe.dang { animation: none; } }

  footer { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--the);
           border-top: 1px solid var(--vien); }
  .ctl { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--vien); background: var(--the); font-size: 16px; flex: none; }
  .ctl:hover { border-color: var(--xanh); color: var(--xanh); }
  #phat { width: 54px; height: 54px; background: var(--xanh); border-color: var(--xanh); color: #fff; font-size: 20px; }
  #phat:hover { background: #0a5f6b; color: #fff; }
  .dang-nghe { min-width: 0; flex: 1; display: grid; gap: 4px; }
  .dang-nghe .ten { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dang-nghe .ten small { color: var(--mo); font-weight: 500; }
  .thanh { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mo); font-variant-numeric: tabular-nums; }
  .thanh input { flex: 1; accent-color: var(--xanh); }
  select { font: inherit; font-weight: 700; border: 1px solid var(--vien); border-radius: 10px; padding: 6px 8px; background: var(--the); }

  dialog { border: 0; border-radius: 16px; padding: 0; background: #000; width: min(900px, 94vw); }
  dialog::backdrop { background: rgba(20, 28, 32, .7); }
  dialog video { display: block; width: 100%; max-height: 80vh; }
  dialog .dong { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border-radius: 50%; border: 0;
                 background: rgba(255,255,255,.9); font-size: 18px; font-weight: 800; z-index: 1; }

  #chon-phan { display: none; max-width: 150px; }
  @media (max-width: 1100px) {
    body { grid-template: var(--dau) 1fr var(--cuoi) / 1fr; }
    aside { display: none; }
    .goi-y { display: none; }
    #chon-phan { display: block; }
    footer { overflow-x: auto; } footer > * { flex: none; } footer .dang-nghe { flex: 1 0 150px; }
  }
</style>
</head>
<body>
<header>
  <h1>Power Up <span>3</span></h1>
  <div class="goi-y">Bấm <b>tai nghe</b> 🎧 để nghe (<b>♪</b> = chữ chạy theo tiếng) · chạm <b>ô trắng</b> để làm bài · chạm <b>số bài</b> để phóng to · ← → lật trang · Space dừng/phát</div>
  <div class="phai">
    <select id="chon-phan" aria-label="Chọn bài"></select>
        <button class="nut-nho" id="viet" aria-pressed="false" title="Viết lên trang bằng Apple Pencil (PC: chuột)">✏️ Viết</button>
    <button class="nut-nho" id="che-do" aria-pressed="true" title="Xem 2 trang cạnh nhau">2 trang</button>
  </div>
</header>

<aside>
  <h2>Giáo trình</h2>
  <nav id="muc-luc"></nav>
  <h2>Trang này học gì</h2>
  <div id="huong-dan"></div>
</aside>

<main id="san">
  <div id="cong-cu" role="toolbar" aria-label="Bút viết">
    <button class="mau" style="--m:#1d2b36;background:#1d2b36" data-m="#1d2b36" aria-label="Bút đen" aria-pressed="true"></button>
    <button class="mau" style="--m:#e03a3a;background:#e03a3a" data-m="#e03a3a" aria-label="Bút đỏ" aria-pressed="false"></button>
    <button class="mau" style="--m:#1f6fd1;background:#1f6fd1" data-m="#1f6fd1" aria-label="Bút xanh dương" aria-pressed="false"></button>
    <button class="mau" style="--m:#1f9d4c;background:#1f9d4c" data-m="#1f9d4c" aria-label="Bút xanh lá" aria-pressed="false"></button>
    <span class="vach"></span>
    <button id="co" title="Đổi nét mảnh / đậm">Mảnh</button>
    <button id="tay" aria-pressed="false" title="Tẩy">🧽 Tẩy</button>
    <span class="vach"></span>
    <button id="hoan-tac" title="Hoàn tác nét vừa viết">↶</button>
    <button id="xoa-trang" title="Xoá hết chữ viết trên trang">🗑</button>
    <span class="vach"></span>
    <button id="phong" aria-pressed="false" title="Chạm vào chỗ cần viết để phóng to">🔍 Phóng to</button>
    <button id="ngon-tay" aria-pressed="false" title="Cho phép ngón tay viết (mặc định chỉ Apple Pencil / chuột)">✋</button>
    <button id="luu-anh" title="Lưu ảnh trang kèm chữ con viết">📷</button>
    <span class="bao" id="bao"></span>
  </div>
  <button class="lat" id="truoc" aria-label="Trang trước">‹</button>
  <button class="lat" id="sau" aria-label="Trang sau">›</button>
</main>

<footer>
  <button class="ctl" id="bai-truoc" aria-label="Bài nghe trước" title="Bài nghe trước">⏮</button>
  <button class="ctl" id="phat" aria-label="Phát / dừng">▶</button>
  <button class="ctl" id="bai-sau" aria-label="Bài nghe sau" title="Bài nghe sau">⏭</button>
  <div class="dang-nghe">
    <div class="ten" id="ten">Chưa chọn bài nghe <small>— bấm tai nghe 🎧 trên trang</small></div>
    <div class="thanh"><span id="da">0:00</span><input type="range" id="tua" min="0" max="1000" value="0" aria-label="Tua"><span id="tong">0:00</span></div>
  </div>
  <button class="nut-nho" id="ca-trang" title="Nghe lần lượt mọi bài trên trang đang mở">Nghe cả trang</button>
  <button class="nut-nho" id="lap" aria-pressed="false" title="Lặp lại bài đang nghe">🔁 Lặp</button>
  <select id="toc" aria-label="Tốc độ" title="Tốc độ đọc">
    <option value="0.75">Chậm</option><option value="1" selected>Thường</option><option value="1.25">Nhanh</option>
  </select>
</footer>

<dialog id="hop-video"><button class="dong" aria-label="Đóng">✕</button><video id="vid" controls playsinline></video></dialog>
<audio id="am" preload="auto"></audio>

<script src="_app/du_lieu.js"></script>
<script>
const D = window.OPW, $ = id => document.getElementById(id);
const TI_LE = 1024 / 1344;                              // rộng/cao ảnh trang
const am = $('am'), san = $('san');
const url = p => p.split('/').map(encodeURIComponent).join('/');
const nho = { doc(k, md) { try { return localStorage.getItem(k) ?? md; } catch { return md; } },
              ghi(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// Lượt xem: bìa, trang tên sách, rồi từng cặp trang đôi (3-4, 5-6, ...) như sách mở
function dsLuot(hai) {
  const ds = [];
  for (let p = 1; p <= D.soTrang;) {
    if (hai && p >= 2 && p < D.soTrang) { ds.push([p, p + 1]); p += 2; } else ds.push([p++]);
  }
  return ds;
}
let haiTrang = nho.doc('pu3-hai', matchMedia('(max-width: 1100px)').matches ? '0' : '1') === '1';
let luot = dsLuot(haiTrang), iLuot = 0;
let iBai = -1, hang = [];                               // bài đang nghe (chỉ số trong D.track), hàng đợi "nghe cả trang"

const phanCua = p => D.phan.find(s => p >= s.tu && p <= s.den);
const anhTrang = p => `_app/trang/p${String(p).padStart(3, '0')}.jpg`;
const soSach = p => p <= 1 ? 'Bìa' : p >= 128 ? 'Bìa sau' : `Trang ${p}`;
// Bản web: tệp nằm trên Drive, may-chu.js cho window.taiTruoc → xin tải trước bài nghe của trang đang mở + ảnh các lượt kề
// (bấm nghe, lật trang khỏi chờ GAS ~3 s mỗi tệp). Bản máy (file://) không có → bỏ qua.
function taiTruocKe() {
  const trang = luot[iLuot], ke = [luot[iLuot + 1], luot[iLuot - 1], luot[iLuot + 2]].flat().filter(Boolean);
  window.taiTruoc?.([...D.track.filter(t => trang.includes(t.trang)).map(t => t.file), ...ke.map(anhTrang)]);
}
const tenBai = t => t.ten || `${t.disc}.${String(t.track).padStart(2, '0')}`;

function veMucLuc() {
  $('muc-luc').innerHTML = D.phan.map((s, i) =>
    `<button class="muc${s.ten.startsWith('Review') ? ' review' : ''}" data-i="${i}"><span>${s.ten}${s.chu ? `<i>${s.chu}</i>` : ''}</span><small>${s.tu > 1 && s.tu < 128 ? s.tu : ''}</small></button>`).join('');
  $('chon-phan').innerHTML = D.phan.map((s, i) => `<option value="${i}">${s.ten}</option>`).join('');
  const toi = i => moTrang(D.phan[i].tu);
  $('muc-luc').onclick = e => { const b = e.target.closest('.muc'); if (b) toi(+b.dataset.i); };
  $('chon-phan').onchange = e => toi(+e.target.value);
}

function moTrang(p) {
  iLuot = Math.max(0, luot.findIndex(l => l.includes(p)));
  ve();
}

function ve() {
  const trang = phong ? [phong.p] : luot[iLuot];
  if (dangVe) chotNet();                                // trang đổi giữa nét: canvas cũ bị gỡ, không bao giờ nhận pointerup → bút treo, hết viết được
  san.querySelectorAll('.trang').forEach(n => { n.querySelector('canvas').width = 0; n.remove(); });   // iPad: trả ngay bộ nhớ canvas (vượt trần thì getContext ra null)
  for (const p of trang) {
    const k = document.createElement('div');
    k.className = 'trang' + (phong ? ' phong' : ''); k.dataset.p = p;
    k.innerHTML = `<div class="lop"><img src="${anhTrang(p)}" alt="${soSach(p)}" draggable="false">` +
                  `<canvas class="viet" data-p="${p}"></canvas></div>${phong ? '' : `<div class="so">${soSach(p)}</div>`}`;
    const lop = k.firstChild;
    D.track.forEach((t, i) => {
      if (t.trang !== p) return;
      const b = document.createElement('button');
      b.className = 'nghe' + (i === iBai ? ' dang' : '');
      b.style.left = t.x * 100 + '%'; b.style.top = t.y * 100 + '%';
      b.dataset.i = i; b.title = b.ariaLabel = 'Nghe ' + tenBai(t); if (t.loai) b.dataset.loai = t.loai;
      b.onclick = () => {                              // bấm lại đúng nút đang đọc = ngừng; nút khác = ngừng cái cũ, đọc cái mới
        hang = [];
        if (i === iBai && !am.paused) { am.pause(); document.querySelectorAll('.nghe.dang').forEach(x => x.classList.remove('dang')); }
        else phat(i);
      };
      lop.appendChild(b);
    });
    ganBut(lop.querySelector('canvas'));
    san.insertBefore(k, $('sau'));
  }
  coGian();
  $('truoc').disabled = iLuot === 0; $('sau').disabled = iLuot === luot.length - 1;
  const s = phanCua(trang[0]), iS = D.phan.indexOf(s);
  document.querySelectorAll('.muc').forEach((b, i) => b.classList.toggle('dang', i === iS));
  $('chon-phan').value = iS;
  nho.ghi('pu3-trang', trang[0]);
  taiTruocKe();
  // lật sang trang không chứa bài đang phát → dừng tiếng, bỏ hàng đợi "Nghe cả trang" (anh báo 27/09/2026);
  // ⏭ bài sau tự lật trang thì vẫn đọc (bài mới nằm trên trang vừa mở), phóng to 1 trang của cặp trang cũng không dừng
  if (iBai >= 0 && !am.paused && !luot[iLuot].includes(D.track[iBai].trang)) {
    hang = []; am.pause(); document.querySelectorAll('.nghe.dang').forEach(b => b.classList.remove('dang'));
  }
}

const chuaBut = () => document.body.classList.contains('dang-viet') ? 54 : 0;   // phần đệm thêm cho thanh bút
function coGian() {                                     // trang vừa khít khung, không cuộn
  const ks = san.querySelectorAll('.trang'); if (!ks.length) return;
  if (phong) {                                          // phóng to 1 trang, lấp đầy khung, kéo bằng ngón tay / lăn chuột
    const k = ks[0], W = san.clientWidth - 24, H = san.clientHeight - 24 - chuaBut();
    k.style.width = W + 'px'; k.style.height = H + 'px';
    const h0 = Math.min(H, W / TI_LE), lh = h0 * phong.s, lw = lh * TI_LE, lop = k.firstChild;
    lop.style.width = lw + 'px'; lop.style.height = lh + 'px'; delete lop.dataset.ve;
    return datPhong();
  }
  const W = san.clientWidth - 24 - 112, H = san.clientHeight - 24 - 26 - chuaBut();
  const h = Math.min(H, W / (ks.length * TI_LE));
  ks.forEach(k => { k.style.height = h + 'px'; k.style.width = h * TI_LE + 'px'; k.firstChild.style.cssText = ''; });
  san.querySelectorAll('canvas.viet').forEach(veLai);
}

const bd = () => D.track[iBai]?.bd || 0;               // giây bắt đầu nội dung: bỏ qua lời dẫn "Page… Unit… Listen and repeat" (_app/tools/5_bo_dan.py)
function phat(i) {
  if (i < 0 || i >= D.track.length) return;
  iBai = i;
  const t = D.track[i];
  if (!luot[iLuot].includes(t.trang)) moTrang(t.trang);
  am.src = url(t.file) + (t.bd ? '#t=' + t.bd : ''); am.playbackRate = +$('toc').value;
  am.play().catch(() => {});
  $('ten').innerHTML = `${tenBai(t)} <small>— ${soSach(t.trang)} · ${phanCua(t.trang).ten}</small>`;
  document.querySelectorAll('.nghe').forEach(b => b.classList.toggle('dang', +b.dataset.i === i));
}

function ngheCaTrang() {
  hang = D.track.map((t, i) => i).filter(i => luot[iLuot].includes(D.track[i].trang));
  if (hang.length) phat(hang.shift());
}

const mmss = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '0:00';
am.ontimeupdate = () => { const b = bd(), dai = am.duration - b;          // giờ + thanh tua tính từ chỗ hết lời dẫn
                          $('da').textContent = mmss(Math.max(0, am.currentTime - b)); $('tong').textContent = mmss(dai);
                          if (dai > 0) $('tua').value = (am.currentTime - b) / dai * 1000; };
